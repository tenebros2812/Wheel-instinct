<style>
:root{--bg:#0d0f10;--panel:#171a1d;--panel2:#202429;--text:#f5f7f8;--muted:#9ea7ae;--gold:#f3c96b;--green:#1c8e58;--red:#bd3d3d;--black:#24272b;--blue:#5fa8ff}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.app{max-width:900px;margin:auto;padding:12px 12px 28px}
h1{font-size:22px;margin:4px 0 2px;letter-spacing:.05em}.sub{color:var(--muted);font-size:13px;margin-bottom:10px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}
.card{background:var(--panel);border:1px solid #2d3237;border-radius:12px;padding:10px}.k{font-size:11px;color:var(--muted);text-transform:uppercase}.v{font-size:20px;font-weight:800;margin-top:2px}
.status{background:var(--panel);border:1px solid #2d3237;border-radius:12px;padding:12px;margin:10px 0}
.status strong{color:var(--gold)} .reason{color:var(--muted);font-size:13px;margin-top:4px}
.table-wrap{background:#0a4a2e;border:5px solid #7f683d;border-radius:16px;padding:10px;box-shadow:0 8px 24px #0008}
.roulette{display:grid;grid-template-columns:72px 1fr;gap:7px}
.zero{display:flex}.zero button{width:100%;min-height:100%;background:#16854e}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.num{position:relative;border:2px solid #d6caa9;color:white;border-radius:7px;min-height:52px;font-size:20px;font-weight:900;box-shadow:inset 0 0 0 1px #0007;touch-action:manipulation}
.num.red{background:var(--red)}.num.black{background:var(--black)}.num.green{background:#16854e}
.num.selected{outline:4px solid var(--gold);outline-offset:1px;transform:translateZ(0);box-shadow:0 0 18px #f3c96b99,inset 0 0 0 1px #000}
.badge{display:none;position:absolute;right:3px;top:3px;background:#fff;color:#111;border-radius:999px;font-size:12px;line-height:1;padding:4px 6px;font-weight:900}
.num.selected .badge{display:block}.rank{display:none;position:absolute;left:4px;bottom:3px;font-size:10px;background:#0009;padding:2px 5px;border-radius:8px}
.num.selected .rank{display:block}
.controls{display:flex;gap:8px;margin:10px 0;flex-wrap:wrap}.ctl{border:1px solid #3b4248;background:var(--panel2);color:white;border-radius:10px;padding:10px 13px;font-weight:700}
.history{display:flex;gap:5px;flex-wrap:wrap;background:var(--panel);border:1px solid #2d3237;border-radius:12px;padding:10px;margin-top:10px;min-height:50px}
.hball{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:800;border:1px solid #ffffff44}.hball.red{background:var(--red)}.hball.black{background:var(--black)}.hball.green{background:#16854e}
.debug{margin-top:10px;background:var(--panel);border-radius:12px;padding:10px;font-size:12px;color:var(--muted)}
.closed{color:#7dffb0;font-weight:900}.warn{color:#ffd27a}
@media(max-width:600px){.stats{grid-template-columns:repeat(2,1fr)}.roulette{grid-template-columns:54px 1fr}.num{min-height:47px;font-size:18px}.app{padding:8px}}
</style>
</head>

const WARMUP=37, NUMBERS=37, STATE_SIZE=48, TARGET_ACTIVITY=0.35, HORIZON=10, STOP_WIN=40;
const RED=new Set([1,3,5,7,9,12,14,16,18,19,21,23,25,27,30,32,34,36]);

function zeros(n){return Array(n).fill(0)}
function matrix(r,c){return Array.from({length:r},()=>zeros(c))}
function dot(a,b){let s=0;for(let i=0;i<a.length;i++)s+=a[i]*b[i];return s}
function norm(a){return Math.sqrt(dot(a,a))}
function matVec(M,v){let out=zeros(M.length);for(let i=0;i<M.length;i++){let s=0,row=M[i];for(let j=0;j<v.length;j++)s+=row[j]*v[j];out[i]=s}return out}
function argsortDesc(a){return Array.from({length:a.length},(_,i)=>i).sort((i,j)=>a[j]===a[i]?i-j:a[j]-a[i])}
function quantile(a,q){let b=a.slice().sort((x,y)=>x-y);if(!b.length)return NaN;let p=(b.length-1)*q,lo=Math.floor(p),hi=Math.ceil(p);if(lo===hi)return b[lo];return b[lo]+(b[hi]-b[lo])*(p-lo)}
function containsTop(ranks,n,k=5){let c=0;for(const r of ranks)if(r.slice(0,k).includes(n))c++;return c}

class HumanInstinctV2{
  constructor(){
    this.embeddings=CONSTS.embeddings; this.recurrent=CONSTS.recurrent; this.bias=CONSTS.bias;
    this.targetActivity=TARGET_ACTIVITY; this.state=zeros(STATE_SIZE);
    this.fast=matrix(NUMBERS,STATE_SIZE);this.slow=matrix(NUMBERS,STATE_SIZE);
    this.counts=zeros(NUMBERS);this.trustSum=zeros(NUMBERS);this.trustWeight=zeros(NUMBERS);
    this.seen=0;this.stateHistory=[];this.rankHistory=[];this.strengthHistory=[];
  }
  cosines(M,v){
    let vn=norm(v),out=Array(NUMBERS).fill(-2);
    for(let i=0;i<NUMBERS;i++){let mn=norm(M[i]),d=mn*vn;if(d>1e-12)out[i]=dot(M[i],v)/d}
    return out;
  }
  z(raw,validMask){
    let valid=[];for(let i=0;i<NUMBERS;i++)if(validMask[i])valid.push(raw[i]);
    let mean=valid.reduce((a,b)=>a+b,0)/valid.length;
    let variance=valid.reduce((s,x)=>s+(x-mean)*(x-mean),0)/valid.length;
    let sd=Math.sqrt(variance)||1;
    let out=raw.map(x=>(x-mean)/sd);for(let i=0;i<NUMBERS;i++)if(!validMask[i])out[i]=-5;
    return out;
  }
  memoryScores(state){
    let valid=this.counts.map(x=>x>0);
    let f=this.z(this.cosines(this.fast,state),valid),s=this.z(this.cosines(this.slow,state),valid);
    let combined=f.map((x,i)=>0.50*(x+s[i])-0.22*Math.abs(x-s[i]));
    return [combined,f,s];
  }
  trustScores(){
    let meanReward=zeros(NUMBERS),eligible=this.trustWeight.map(x=>x>=3);
    for(let i=0;i<NUMBERS;i++)meanReward[i]=this.trustSum[i]/Math.max(this.trustWeight[i],3);
    if(eligible.filter(Boolean).length<8)return zeros(NUMBERS);
    let z=this.z(meanReward,eligible);
    for(let i=0;i<NUMBERS;i++){if(!eligible[i])z[i]=0;z[i]=Math.max(-2,Math.min(2,z[i]))}
    return z;
  }
  resistance(candidate){
    if(!this.stateHistory.length)return 1;
    let survived=0;
    for(const old of this.stateHistory){
      let p=this.state.map((x,i)=>0.88*x+0.12*old[i]),n=norm(p);if(n)p=p.map(x=>x/n);
      let [scores]=this.memoryScores(p),top5=argsortDesc(scores).slice(0,5);
      if(top5.includes(candidate))survived++;
    }
    return survived/this.stateHistory.length;
  }
  threshold(){
    if(this.strengthHistory.length<80)return 1.75;
    return quantile(this.strengthHistory,1-this.targetActivity);
  }
  decide(){
    if(this.seen<WARMUP)return {active:false,selection:[],shadow:[],strength:0,threshold:Infinity,top_scores:[],agreement:0,resistance:0,trust:0,reason:"mémoire insuffisante"};
    if(this.counts.filter(x=>x>0).length<8)return {active:false,selection:[],shadow:[],strength:0,threshold:Infinity,top_scores:[],agreement:0,resistance:0,trust:0,reason:"mémoires individuelles insuffisantes"};

    let [memory,fast,slow]=this.memoryScores(this.state),trust=this.trustScores(),stability=zeros(NUMBERS);
    for(let n=0;n<NUMBERS;n++)stability[n]=containsTop(this.rankHistory,n,5)/Math.max(1,this.rankHistory.length);
    let preliminary=memory.map((x,i)=>x+0.28*trust[i]+0.18*stability[i]),preOrder=argsortDesc(preliminary),res=zeros(NUMBERS);
    for(const n of preOrder.slice(0,7))res[n]=this.resistance(n);
    let final=preliminary.map((x,i)=>x+0.24*res[i]);
    let order=Array.from({length:NUMBERS},(_,i)=>i).sort((a,b)=>final[b]===final[a]?a-b:final[b]-final[a]);
    let shadow=order.slice(0,3),top=order[0];
    let agreement=Math.max(0,1-Math.abs(fast[top]-slow[top])/3);
    let margin=final[top]-final[order[3]],strength=final[top]+0.28*margin+0.22*agreement,threshold=this.threshold();
    let chosen=[];
    for(const n of order.slice(0,3)){
      let agreeN=Math.max(0,1-Math.abs(fast[n]-slow[n])/3);
      if(final[n]>=0.95 && res[n]>=0.50 && agreeN>=0.35)chosen.push(n);
    }
    this.strengthHistory.push(strength);if(this.strengthHistory.length>500)this.strengthHistory.shift();
    this.rankHistory.push(order.slice(0,7));if(this.rankHistory.length>5)this.rankHistory.shift();
    let active,reason;
    if(strength<threshold){active=false;reason="sensation sous le niveau habituel"}
    else if(!chosen.length){active=false;reason="intuition fragile ou contradictoire"}
    else{active=true;reason="instinct actif"}
    return {active,selection:active?chosen.slice(0,3):[],shadow,strength,threshold,
      top_scores:order.slice(0,7).map(n=>[n,final[n]]),agreement,resistance:res[top],trust:trust[top],reason};
  }
  feedback(decision,result){
    for(let i=0;i<NUMBERS;i++){this.trustSum[i]*=0.997;this.trustWeight[i]*=0.997}
    for(const n of decision.shadow){let reward=n===result?1:-(1/36);this.trustSum[n]+=reward;this.trustWeight[n]+=1}
  }
  observe(number){
    if(this.seen){
      if(this.counts[number]===0){this.fast[number]=this.state.slice();this.slow[number]=this.state.slice()}
      else{
        for(let i=0;i<STATE_SIZE;i++){
          this.fast[number][i]=0.82*this.fast[number][i]+0.18*this.state[i];
          this.slow[number][i]=0.97*this.slow[number][i]+0.03*this.state[i];
        }
      }
      this.counts[number]++;
    }
    this.stateHistory.push(this.state.slice());if(this.stateHistory.length>4)this.stateHistory.shift();
    let rv=matVec(this.recurrent,this.state),driven=zeros(STATE_SIZE),next=zeros(STATE_SIZE);
    for(let i=0;i<STATE_SIZE;i++){
      driven[i]=rv[i]+this.embeddings[number][i]+this.bias[i];
      next[i]=Math.tanh(0.68*this.state[i]+0.32*driven[i]);
    }
    let nn=norm(next);if(nn)next=next.map(x=>x/nn);this.state=next;this.seen++;
  }
}

function unitForGap(g){if(g<3)return 1;if(g<12)return 2;return 4+Math.floor((g-12)/3)}

class CasinoApp{
  constructor(){
    this.history=[];this.rebuild();
  }
  rebuild(){
    this.engine=new HumanInstinctV2();this.active=null;this.cycleId=0;this.lossGap=0;this.balance=0;this.closed=false;this.lastOutcome=null;
    this.pending=this.engine.decide();
    const hist=this.history.slice();this.history=[];
    for(const n of hist)this.apply(n,false);
    this.render();
  }
  prepareNext(){
    this.pending=this.engine.decide();
    if(!this.closed && !this.active && this.pending.active){
      this.cycleId++;
      this.active={id:this.cycleId,selection:this.pending.selection.slice(),rank:0,strength:this.pending.strength};
    }
  }
  apply(number,doRender=true){
    if(this.history.length===0 && this.engine.seen===0){this.pending=this.engine.decide()}
    let outcome={played:false,hit:false,pnl:0,unit:0,rank:0,selection:[]};
    if(this.active && !this.closed){
      this.active.rank++;
      const selection=this.active.selection.slice(),unit=unitForGap(this.lossGap),hit=selection.includes(number),stake=selection.length*unit;
      const pnl=hit?unit*(36-selection.length):-stake;
      this.balance+=pnl;
      outcome={played:true,hit,pnl,unit,rank:this.active.rank,selection};
      if(hit)this.lossGap=0;else this.lossGap++;
      if(hit || this.active.rank>=HORIZON)this.active=null;
      if(this.balance>=STOP_WIN){this.closed=true;this.active=null}
    }
    this.engine.feedback(this.pending,number);
    this.engine.observe(number);
    this.history.push(number);this.lastOutcome=outcome;
    this.prepareNext();
    if(doRender)this.render();
  }
  click(n){this.apply(n,true)}
  undo(){if(!this.history.length)return;this.history.pop();this.rebuild()}
  reset(){this.history=[];this.rebuild()}
  render(){
    document.getElementById("balls").textContent=this.history.length;
    document.getElementById("warm").textContent=Math.min(this.history.length,WARMUP)+" / 37";
    document.getElementById("balance").textContent=(this.balance>=0?"+":"")+this.balance+"u";
    const currentUnit=this.active&&!this.closed?unitForGap(this.lossGap):null;
    document.getElementById("unit").textContent=currentUnit?currentUnit+"u":"—";

    document.querySelectorAll(".num").forEach(b=>{b.classList.remove("selected");b.querySelector(".badge").textContent="";b.querySelector(".rank").textContent=""});
    if(this.active&&!this.closed){
      for(const n of this.active.selection){
        const b=document.querySelector(`.num[data-n="${n}"]`);if(!b)continue;
        b.classList.add("selected");b.querySelector(".badge").textContent=currentUnit+"u";b.querySelector(".rank").textContent="chasse "+(this.active.rank+1)+"/10";
      }
    }

    let headline="",reason="";
    if(this.closed){headline=`<span class="closed">STOP-WIN atteint : session +${this.balance}u</span>`;reason="Nouvelle session pour repartir à zéro."}
    else if(this.history.length<WARMUP){headline=`<strong>Apprentissage :</strong> encore ${WARMUP-this.history.length} boule(s).`;reason="Entre simplement chaque résultat sur le tapis."}
    else if(this.active){
      headline=`<strong>JEU ACTIF :</strong> ${this.active.selection.join(" • ")} — ${currentUnit}u par numéro`;
      reason=`Chasse ${this.active.rank+1}/10 à jouer au prochain coup. Force d’ouverture : ${this.active.strength.toFixed(3)}.`;
    }else{
      headline=`<strong>PAS DE MISE.</strong> Le moteur observe.`;
      reason=`${this.pending.reason} — force ${Number.isFinite(this.pending.strength)?this.pending.strength.toFixed(3):"—"} / seuil ${Number.isFinite(this.pending.threshold)?this.pending.threshold.toFixed(3):"—"}.`;
    }
    document.getElementById("headline").innerHTML=headline;document.getElementById("reason").textContent=reason;

    const h=document.getElementById("history");h.innerHTML="";
    for(const n of this.history.slice(-24)){
      const s=document.createElement("span");s.className="hball "+colorClass(n);s.textContent=n;h.appendChild(s)
    }
    const top=this.pending.top_scores?.length?this.pending.top_scores.map(([n,s])=>`${n}:${s.toFixed(2)}`).join("  |  "):"—";
    const last=this.lastOutcome?.played?` • dernier : ${this.lastOutcome.hit?"HIT":"perte"} ${this.lastOutcome.pnl>=0?"+":""}${this.lastOutcome.pnl}u`:"";
    document.getElementById("debug").textContent=`Top instinct : ${top}${last}`;
  }
}
function colorClass(n){return n===0?"green":RED.has(n)?"red":"black"}

document.getElementById("jsstatus").textContent="Moteur actif — touche un numéro";document.getElementById("jsstatus").style.color="#7dffb0";
const app=new CasinoApp();
document.querySelectorAll(".num").forEach(b=>b.addEventListener("click",()=>app.click(Number(b.dataset.n))));
document.getElementById("undo").addEventListener("click",()=>app.undo());
document.getElementById("reset").addEventListener("click",()=>{if(confirm("Effacer toute la session ?"))app.reset()});
</script>
